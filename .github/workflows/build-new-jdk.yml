name: Build - New JDK

on:
  push:
    branches:
      - 'master'
      - 'main'
    tags:
      - 'v*'

  workflow_dispatch:

  schedule:
    - cron: '55 5 * * 5'

jobs:

  build-21:
    name: build 21
    uses: s4u/.github/.github/workflows/maven-build.yml@master
    with:
      java-matrix:  '["21"]'
      java-dist-matrix: '["zulu", "temurin", "liberica", "microsoft", "corretto", "semeru"]'

    secrets: inherit

  build-22:
    needs: [ build-21 ]
    name: build 22
    uses: s4u/.github/.github/workflows/maven-build.yml@master
    with:
      java-matrix:  '["22-ea"]'
      java-dist-matrix: '["zulu", "temurin", "liberica", "microsoft", "corretto", "semeru"]'

    secrets: inherit

  verify-ok:
    name: OK
    needs: [ build-21, build-22 ]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - run: 'true'
        if: needs.build-21.result == 'success' && needs.build-22.result == 'success'

      - run: 'false'
        if: needs.build-21.result != 'success' || needs.build-22.result != 'success'
